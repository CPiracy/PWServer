[project]
name = "builder"
version = "0.1.0"
description = "Prepare Perfect World server and game data files for Debian packaging."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.29.2",
]

[project.scripts]
build = "src.main:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
